<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Space Live Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    #console { padding: 1em; }
    #ws-log { height: 200px; overflow: auto; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <div id="program-manager" style="padding: 1em; border-top: 1px solid #e5e5e5;">
    <h2>節目管理 Program Manager</h2>
    <div style="margin-bottom: 0.5em; display:flex; gap:8px; align-items:center;">
      <button id="pm-refresh">刷新</button>
      <button id="pm-stop-all" style="background:#c62828;color:#fff;border:none;padding:6px 10px;border-radius:4px;">全部停止</button>
      <span id="pm-status" style="margin-left:8px;color:#555;"></span>
    </div>
    <div id="pm-list"></div>
    <div id="pm-msg" style="margin-top:8px;color:#666;font-size:12px;"></div>
  </div>
  <div id="console">
    <h2>WebSocket Console</h2>
    <input id="ws-input" type="text" placeholder="Message" />
    <button id="ws-send">Send</button>
    <button id="ws-clear">Clear</button>
    <button id="ws-download">Download Log</button>
    <pre id="ws-log"></pre>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    SwaggerUIBundle({
      url: '/openapi.json',
      dom_id: '#swagger-ui'
    });
  </script>
  <script src="/admin-static/admin.js"></script>
</body>
</html>
